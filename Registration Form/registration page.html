<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration page.html</title>
    <link rel="stylesheet" href="/Registration Form/style.css" />
  </head>
  <body>
    <form action="img3.png">
      <fieldset>
        <legend>Personal Details</legend>
        <label for="Firstname">Firstname</label>
        <input
          type="text"
          required
          placeholder="Enter your name in caps"
          id="Firstname"
          pattern="[a-zA-Z],{3,10}"
        /><br /><br />
        <label for="lname">Lastname</label>
        <input
          type="text"
          placeholder="Enter your lastname"
          id="lname"
        /><br /><br />
        <label for="Firstname">Email</label>
        <input
          type="email"
          placeholder="ie.xxx@gmail"
          id="Firstname"
        /><br /><br />
        <label for="ph">Phone number</label>
        <input
          type="tel"
          id="ph"
          placeholder="Mobile Number"
          pattern="[6-9][0-9]{9}"
        /><br /><br />
        <label for="dob">Date of birth</label>
        <input type="date" placeholder="ie.xxx@gmail" id="dob" /><br /><br />
      </fieldset>
      <fieldset>
        <legend>Education Details</legend>
        <label for="dob">Department</label><br /><br />
        <input type="radio" id="CS" name="dept" />
        <label for="CS">CS</label>
        <input type="radio" id="Civil" name="dept" />
        <label for="Civil">Civil</label>
        <input type="radio" id="Mech" name="dept" />
        <label for="Mech">Mech</label><br /><br />
        <label for="sk">Skills</label><br /><br />
        <input type="checkbox" id="html" />
        <label for="html">HTML</label>
        <input type="checkbox" id="css" />
        <label for="css">CSS</label>
        <input type="checkbox" id="js" />
        <label for="js">JS</label><br /><br />
        <label for="yog">Year of Graduation</label>
        <select name="yog" id="">
          <option value="">2000</option>
          <option value="">2001</option>
          <option value="">2002</option></select
        ><br /><br />
        <input type="submit" />
      </fieldset>
    </form>
  </body>
</html>
